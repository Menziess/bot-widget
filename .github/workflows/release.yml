name: release

# Een tag als v0.1.0 bouwt de apps en zet ze op GitHub Releases. De website linkt
# naar releases/latest/download/<vaste naam>, dus de namen mogen niet veranderen.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bouwen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: BotWidget-macOS.zip
          - os: windows-latest
            artifact: BotWidget-Windows-Setup.exe
          - os: ubuntu-latest
            artifact: BotWidget-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Systeembibliotheken voor Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0

      - name: Inno Setup voor het Windows-installatieprogramma
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Bouwen
        run: |
          python -m pip install PySide6-Essentials pyinstaller
          python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  publiceren:
    needs: bouwen
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
