name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt loads a few system libraries on a bare Linux runner.
      - name: System libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Install like a user
        run: python -m pip install .

      - name: Logic tests without a screen
        run: python -m unittest discover -s tests -t . -v

      - name: The Qt layer imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd tests && python -c "import botwidget.qt_ui.app"

  # The macOS install script (bot-widget.com/install.sh): lint, and the stubbed tests run on Linux.
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -s sh packaging/install-macos.sh packaging/test_install_macos.sh
      - name: Tests with stubbed tools
        run: sh packaging/test_install_macos.sh

  # The same script for real on a Mac, against the latest release, into a throwaway home.
  install-script-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          home="$(mktemp -d)"
          # The tag comes from an authenticated call, so the anonymous API limit cannot make this flaky.
          version="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          HOME="$home" BOTWIDGET_NO_OPEN=1 BOTWIDGET_VERSION="$version" sh packaging/install-macos.sh
          test -d "$home/Applications/Bot Widget.app"
          codesign --verify --deep --strict "$home/Applications/Bot Widget.app"
