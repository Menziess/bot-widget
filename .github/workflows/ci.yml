name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt loads a few system libraries on a bare Linux runner.
      - name: System libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Install like a user
        run: python -m pip install .

      - name: Logic tests without a screen
        run: python -m unittest discover -s tests -t . -v

      - name: The Qt layer imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd tests && python -c "import botwidget.qt_ui.app"

  # The macOS install script (bot-widget.com/install.sh): lint, and the stubbed tests run on Linux.
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -s sh packaging/install-macos.sh packaging/test_install_macos.sh
      - name: Tests with stubbed tools
        run: sh packaging/test_install_macos.sh

  # The same script for real on a Mac, against the latest release, into a throwaway home.
  install-script-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          home="$(mktemp -d)"
          # The tag comes from an authenticated call, so the anonymous API limit cannot make this flaky.
          version="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          HOME="$home" BOTWIDGET_NO_OPEN=1 BOTWIDGET_VERSION="$version" sh packaging/install-macos.sh
          test -d "$home/Applications/Bot Widget.app"
          codesign --verify --deep --strict "$home/Applications/Bot Widget.app"

  msix:
    runs-on: windows-latest
    env:
      MSIX_IDENTITY_NAME: "test.BotWidget"
      MSIX_PUBLISHER: "CN=00000000-0000-0000-0000-000000000000"
      MSIX_PUBLISHER_DISPLAY_NAME: "Test"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e . pyinstaller

      - name: Build MSIX
        run: python packaging/build.py --msix

      - name: Unpack the MSIX
        shell: pwsh
        run: |
          $makeappx = python -c "import sys; sys.path.insert(0, 'packaging'); import msix; print(msix.find_makeappx() or '')"
          if (-not $makeappx) { Write-Output "makeappx not found"; exit 1 }
          & $makeappx unpack /p dist/BotWidget-Windows.msix /d "$env:RUNNER_TEMP/unpacked" /o
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check the unpacked MSIX
        shell: python
        run: |
          import os, re, sys
          sys.path.insert(0, "packaging")
          import msix, xml.etree.ElementTree as ET
          folder = os.path.join(os.environ["RUNNER_TEMP"], "unpacked")
          manifest = os.path.join(folder, "AppxManifest.xml")
          assert os.path.isfile(manifest), "AppxManifest.xml missing"
          root = ET.parse(manifest).getroot()
          assert root.tag.endswith("}Package"), f"bad root: {root.tag}"
          identity = root.find(
              "{http://schemas.microsoft.com/appx/manifest/foundation/windows10}Identity"
          )
          ver = identity.get("Version", "")
          assert re.fullmatch(r"\d+\.\d+\.\d+\.\d+", ver), f"bad version: {ver}"
          assert ver.endswith(".0"), f"version must end in .0: {ver}"
          assets = os.path.join(folder, "Assets")
          for key in msix.ASSETS:
              assert os.path.isdir(assets), "Assets folder missing"
              assert os.path.isfile(os.path.join(assets, key)), f"Asset missing: {key}"
          exe = os.path.join(folder, "Bot Widget.exe")
          assert os.path.isfile(exe), "Bot Widget.exe missing"
          print("MSIX unpacked and checked")

      - uses: actions/upload-artifact@v4
        with:
          name: BotWidget-Windows.msix
          path: dist/BotWidget-Windows.msix
          if-no-files-found: error
