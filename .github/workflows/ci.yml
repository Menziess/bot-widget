name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt loads a few system libraries on a bare Linux runner.
      - name: System libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Install like a user
        run: python -m pip install .

      - name: Logic tests without a screen
        run: python -m unittest discover -s tests -t . -v

      - name: The Qt layer imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd tests && python -c "import botwidget.qt_ui.app"
