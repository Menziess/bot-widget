name: pages

# bot-widget.com is served from the site/ folder. In the repository settings, set Pages to "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "packaging/install-macos.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # bot-widget.com/install.sh is the macOS installer; packaging/install-macos.sh is the only copy in git.
      - name: The macOS install script
        run: cp packaging/install-macos.sh site/install.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
