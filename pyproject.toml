[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "botwidget"
dynamic = ["version"]
description = "Animated desktop bot face with a speech bubble for OpenBot and Grok Bot."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6", "agent-client-protocol>=0.12,<1", "mcp>=2.3", "certifi"]

[project.scripts]
botwidget = "botwidget.qt_ui.app:main"

# The version comes from the git tag (v0.1.1 becomes 0.1.1) and is baked into the package.
[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0+unknown" }

[tool.hatch.build.hooks.vcs]
version-file = "botwidget/_version.py"

[tool.hatch.build.targets.wheel]
# harness is imported by botwidget.acplink. A wheel of only botwidget breaks
# `import botwidget.qt_ui.app` once the checkout is not on PYTHONPATH.
packages = ["botwidget", "harness"]

[tool.ruff]
line-length = 110
